services:
  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint_local_only
      POSTGRES_DB: waypoint
    ports:
      - "5432:5432"
    volumes:
      - waypoint-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  waypoint-db-data:
